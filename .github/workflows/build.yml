name: Unit testing

on: [push, pull_request]

jobs:
  posix-build-and-test:
    permissions:
      checks: write
    runs-on: ubuntu-latest
    container: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: thingsetplusplus
          submodules: 'true'

      - name: Build Examples
        working-directory: thingsetplusplus
        run: |
          apt-get update && apt-get install -y cmake; cd examples; for i in `find . -maxdepth 1 -type d -not -iname "zephyr*"`; do cd $i && cmake -S . -B build && cd build && make && cd .. && cd ..; done || exit 1; cd ..

      - name: Run Tests
        working-directory: thingsetplusplus
        run: |
          cd tests && cmake -S . -B build && cd build && make && ./testapp --gtest_output="xml:report.xml"

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          comment_mode: off
          check_name: posix
          files: |
            **/report.xml

  zephyr-build-and-test:
    permissions:
      checks: write
    # Pinned: ubuntu-latest moved to Ubuntu 26.04 in October 2026 and the
    # native_sim tests do not build there. Its glibc 2.43 names a struct
    # member __unused (bits/struct_mutex.h), which Zephyr's toolchain/gcc.h
    # defines as a macro, so every C++ translation unit fails to compile.
    # glibc is expected to rename it in 2.44. Revisit on a newer image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: thingsetplusplus

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: thingsetplusplus
          toolchains: x86_64-zephyr-elf

      - name: Run Zephyr Tests
        # Zephyr 4.1's FindZephyr-sdk.cmake fails to parse under CMake >= 4
        # (now on ubuntu-latest) when ZEPHYR_TOOLCHAIN_VARIANT is unset
        # See zephyrproject-rtos/zephyr#113746
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: zephyr
        run: |
          west build -p -b native_sim/native/64 thingsetplusplus/tests/zephyr/can -T thingset++.ZephyrClientServer
          zephyr/scripts/twister -T thingsetplusplus/tests/zephyr/can -p native_sim/native/64 -v -v
          west build -p -b native_posix/native/64 thingsetplusplus/tests/zephyr/persistence -T thingset++.ZephyrPersistence
          zephyr/scripts/twister -T thingsetplusplus/tests/zephyr/persistence -p native_posix/native/64 -v -v

      - name: Publish Zephyr Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          comment_mode: off
          check_name: zephyr
          files: |
            **/twister.xml
            **/twister_report.xml

